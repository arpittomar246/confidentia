[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "confidentia"
version = "0.1.0"
description = "A confidential lakehouse platform: attested, privacy-preserving data engineering on untrusted cloud infrastructure"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Arpit Tomar", email = "arpittomar246@gmail.com" }]

# Base dependencies only. Heavy subsystems live in extras so that an 8 GB
# development machine never has to install or import what it is not running.
dependencies = [
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "structlog>=24.4",
    "python-dotenv>=1.0",
    "cryptography>=43.0",
    "orjson>=3.10",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# Spark + Delta. Pinned as a set: delta-spark 3.2.x targets Spark 3.5.x only.
spark = [
    "pyspark==3.5.3",
    "delta-spark==3.2.1",
    "pyarrow>=15.0,<18",
]
# Python-side lakehouse reader used by the API layer (no JVM).
lake = [
    "deltalake>=0.20,<1.0",
    "duckdb>=1.1",
    "pyarrow>=15.0,<18",
]
storage = [
    "psycopg[binary]>=3.2",
    # Separate distribution from psycopg itself; store.db imports it directly.
    "psycopg-pool>=3.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "boto3>=1.35",          # MinIO / S3-compatible object store
]
# HTTP source collectors. Split from `api` because ingesting from a REST source and
# serving one are different jobs with different deployment targets.
ingestion = [
    "httpx>=0.27",
]
stream = [
    "confluent-kafka>=2.5",
]
cdc = [
    "psycopg2-binary>=2.9",  # logical replication client needs the v2 driver
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "authlib>=1.3",
    "pyjwt[crypto]>=2.9",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
]
generators = [
    "faker>=28.0",
    "numpy>=1.26,<2.2",
    "pandas>=2.2",
    # pandas.to_parquet needs an engine; the generators write Parquet by default.
    "pyarrow>=15.0,<18",
]
observability = [
    "prometheus-client>=0.21",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
]

[project.scripts]
confidentia = "confidentia.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF", "BLE"]
# E501  line length is handled by the formatter.
# N812  `from pyspark.sql import functions as F` is the universal PySpark idiom;
#       renaming it would make every transformation unidiomatic.
ignore = ["E501", "N812"]

# BLE001 stays enabled globally so that broad excepts must be justified with an
# explicit noqa at the site, rather than blanket-permitted by directory.

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
files = ["src"]

# `disallow_untyped_defs` is NOT global. Requiring full annotations everywhere on a
# codebase that is largely Spark DataFrame plumbing produces noise rather than
# safety -- a `DataFrame -> DataFrame` signature says nothing a reader did not
# already know. It is enforced where a type error would be a *correctness or
# security* defect: key handling, attestation, sensitivity classification, and the
# settings that drive them.
[[tool.mypy.overrides]]
module = [
    "confidentia.crypto.*",
    "confidentia.catalog.*",
    "confidentia.config.*",
    "confidentia.common.*",
]
disallow_untyped_defs = true

# PySpark's stubs model Column operations loosely, so expressions built from
# `functions as F` frequently type as Any and any stricter setting here reports the
# library rather than this code.
[[tool.mypy.overrides]]
module = ["confidentia.pipelines.*", "confidentia.generators.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast, no external services",
    "integration: needs Postgres/MinIO/Kafka",
    "spark: needs a JVM and a SparkSession",
    "slow: long-running benchmark or scale test",
]
