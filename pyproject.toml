[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "confidentia"
version = "0.1.0"
description = "A confidential lakehouse platform: attested, privacy-preserving data engineering on untrusted cloud infrastructure"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Arpit Tomar", email = "arpittomar246@gmail.com" }]

# Base dependencies only. Heavy subsystems live in extras so that an 8 GB
# development machine never has to install or import what it is not running.
dependencies = [
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "structlog>=24.4",
    "python-dotenv>=1.0",
    "cryptography>=43.0",
    "orjson>=3.10",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# Spark + Delta. Pinned as a set: delta-spark 3.2.x targets Spark 3.5.x only.
spark = [
    "pyspark==3.5.3",
    "delta-spark==3.2.1",
    "pyarrow>=15.0,<18",
]
# Python-side lakehouse reader used by the API layer (no JVM).
lake = [
    "deltalake>=0.20,<1.0",
    "duckdb>=1.1",
    "pyarrow>=15.0,<18",
]
storage = [
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "boto3>=1.35",          # MinIO / S3-compatible object store
]
stream = [
    "confluent-kafka>=2.5",
]
cdc = [
    "psycopg2-binary>=2.9",  # logical replication client needs the v2 driver
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "authlib>=1.3",
    "pyjwt[crypto]>=2.9",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
]
generators = [
    "faker>=28.0",
    "numpy>=1.26,<2.2",
    "pandas>=2.2",
]
observability = [
    "prometheus-client>=0.21",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
]

[project.scripts]
confidentia = "confidentia.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF", "BLE"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Spikes and probes deliberately catch broad exceptions: their job is to report
# what a subsystem does when it fails, not to propagate the failure.
"spikes/**" = ["BLE001"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast, no external services",
    "integration: needs Postgres/MinIO/Kafka",
    "spark: needs a JVM and a SparkSession",
    "slow: long-running benchmark or scale test",
]
