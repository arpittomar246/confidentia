name: Release

# Tag-triggered, plus a manual dry run.
#
# The dry run exists because a release pipeline nobody has executed is a release
# pipeline that does not work -- the lesson Stage 13 learned from a compose file
# that had been "validated" for eleven stages without ever being built. It does
# everything except push and attest, so the build, the SBOM and the manifest can be
# exercised without creating a package or a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      push_images:
        description: "Push to GHCR and attest. Leave false for a dry run."
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never cancel a release half-published

permissions:
  contents: write     # create the GitHub Release
  packages: write     # push to GHCR
  id-token: write     # Sigstore, for build provenance
  attestations: write

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: docker/backend/Dockerfile
          - image: frontend
            dockerfile: docker/frontend/Dockerfile
          - image: spark
            dockerfile: docker/spark/Dockerfile
          - image: airflow
            dockerfile: docker/airflow/Dockerfile
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Reclaim disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - uses: docker/setup-buildx-action@v4

      - name: Work out whether this run publishes
        id: mode
        run: |
          if [[ "${{ github.event_name }}" == "push" || "${{ inputs.push_images }}" == "true" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Dry run — building and generating an SBOM, pushing nothing."
          fi

      - name: Log in to GHCR
        if: steps.mode.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build ${{ matrix.image }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ steps.mode.outputs.publish == 'true' }}
          load: ${{ steps.mode.outputs.publish != 'true' }}
          tags: ${{ steps.mode.outputs.publish == 'true' && steps.meta.outputs.tags || format('confidentia-{0}:dryrun', matrix.image) }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub's cache, not the registry's: a dry run has nowhere to push a
          # cache manifest to.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # An SBOM is generated whether or not the image is published. For a project
      # whose subject is provenance, "which packages went into this artefact" is
      # not an afterthought -- it is the same question the lineage chain answers
      # about data, asked about the build.
      # Trivy as a pinned container rather than a marketplace action. The first
      # version of this workflow used `aquasecurity/trivy-action@0.28.0`, which does
      # not exist -- the tags carry a `v` prefix and start at v0.30 -- and every job
      # failed in `Set up job` before building anything. The image is the same thing
      # a developer runs by hand, and its version is one this project has actually
      # used.
      #
      # A dry run has no pushed digest to scan, so it scans the locally loaded tag.
      - name: Generate SBOM
        env:
          IMAGE_REF: ${{ steps.mode.outputs.publish == 'true' && format('{0}/{1}-{2}@{3}', env.REGISTRY, github.repository, matrix.image, steps.build.outputs.digest) || format('confidentia-{0}:dryrun', matrix.image) }}
          # Trivy carries its own registry credentials when publishing, and this
          # is the one line a dry run can never test. Publishing sets `push: true`
          # and `load: false`, so the image is in GHCR and *not* in this runner's
          # daemon; the scan is therefore a remote pull. The package is private
          # because the repository is, and the host's `docker login` does not reach
          # inside the trivy container, which is given only the socket and the
          # workspace. Without these, trivy requests an anonymous token and GHCR
          # answers UNAUTHORIZED -- which is exactly how v0.1.0 failed, after dry
          # runs that each scanned a local tag and authenticated to nothing.
          # Passed through by name, not by value, so the token stays out of the
          # command line and the process list.
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" -w /work \
            -e TRIVY_USERNAME -e TRIVY_PASSWORD \
            aquasec/trivy:0.73.0 image --quiet \
            --scanners license,vuln --format cyclonedx \
            --output "sbom-${{ matrix.image }}.cdx.json" \
            "$IMAGE_REF"
          echo "SBOM components: $(python3 -c "import json;print(len(json.load(open('sbom-${{ matrix.image }}.cdx.json')).get('components',[])))")"

      - uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.image }}
          path: sbom-${{ matrix.image }}.cdx.json
          retention-days: 90

      # Build provenance, signed through Sigstore. No key to manage and none to
      # lose: the signing identity is this workflow's OIDC token, so what the
      # attestation says is "this digest was built by this workflow, from this
      # commit" -- verifiable afterwards with `gh attestation verify`.
      #
      # The parallel with the platform is exact and worth stating: CONFIDENTIA
      # refuses to release a key to code whose measurement it has not approved, and
      # this refuses to claim an image was built here without evidence a third
      # party can check. Same idea, one layer up.
      - name: Attest build provenance
        if: steps.mode.outputs.publish == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    needs: images
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: {pattern: sbom-*, merge-multiple: true}

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "## Images"
            echo
            for image in api frontend spark airflow; do
              echo "- \`${REGISTRY}/${GITHUB_REPOSITORY}-${image}:${TAG#v}\`"
            done
            echo
            echo "Each image carries a Sigstore build-provenance attestation. Verify one with:"
            echo
            echo '```bash'
            echo "gh attestation verify oci://${REGISTRY}/${GITHUB_REPOSITORY}-api:${TAG#v} --repo ${GITHUB_REPOSITORY}"
            echo '```'
            echo
            echo "CycloneDX SBOMs for every image are attached."
          } > notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md ./*.cdx.json
