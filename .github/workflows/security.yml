name: Security

# Weekly as well as on push, because the code not changing is exactly when a new
# advisory lands against a dependency that has not moved. A scanner that only runs
# on commits stops running the moment a project goes quiet -- which is when it is
# most useful.
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  schedule:
    - cron: "17 6 * * 1"   # Mondays, 06:17 UTC. Off the hour to avoid the stampede.
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write   # to upload SARIF to the Security tab

env:
  # The scanner runs as a **container**, not as a marketplace action, and is pinned
  # to the version verified locally. The first version of this workflow used
  # `aquasecurity/trivy-action@0.28.0`, which does not exist -- the tags carry a `v`
  # prefix and start at v0.30 -- so every job failed in `Set up job` before running
  # anything. Using the image removes a guess about someone else's tagging scheme,
  # and makes `docker run` here identical to what a developer runs by hand.
  TRIVY: aquasec/trivy:0.73.0

jobs:
  # Python dependencies, audited against PyPI advisories.
  #
  # `--strict` so that a package pip-audit cannot resolve is a failure rather than
  # a silent gap.
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -e ".[dev,generators,storage,ingestion,cdc,spark,lake,api,observability,stream]"
      - run: pip install pip-audit
      - name: Audit dependencies
        # Audited from a frozen list rather than the live environment, because
        # `pip-audit` on the environment tries to resolve **this project** against
        # PyPI -- "Dependency not found on PyPI and could not be audited:
        # confidentia (0.1.0)" -- which `--strict` correctly treats as a failure.
        # `--skip-editable` does not help: the editable install is PEP 660, and
        # pip-audit does not recognise it as editable.
        #
        # `--strict` is kept, because the whole point is that a package which
        # cannot be resolved is a gap rather than a pass. Freezing first narrows
        # what is audited to real third-party dependencies without weakening that.
        #
        # PYSEC-2026-113 (pyarrow) is ignored with a reason, and the reason is the
        # advisory's own text: the use-after-free is in Arrow C++ behind
        # `RecordBatchFileReader::PreBufferMetadata`, and upstream states the
        # functionality "is not exposed in language bindings (Python, Ruby, C
        # GLib), so these bindings are not vulnerable". This project is Python
        # only. See ADR 0020.
        run: |
          pip freeze --exclude-editable > frozen.txt
          echo "auditing $(wc -l < frozen.txt) pinned packages"
          pip-audit --strict --no-deps -r frozen.txt --ignore-vuln PYSEC-2026-113

  # Every image is scanned and every result reaches the Security tab. Only two are
  # *gated*, and the difference is whether this repository can act on a finding.
  #
  # Measured 2026-08-13, fixable HIGH/CRITICAL:
  #
  #   frontend   0     nginx:1.31-alpine
  #   api        0     after bringing pip's tooling current and removing pip
  #   spark     55     org.apache.derby, zookeeper, avro, thrift, protobuf ...
  #   airflow  125     ray, litellm, openssl, gnutls, the Debian base ...
  #
  # Re-measured 2026-11-02, after eleven weeks of advisory drift turned the frontend
  # gate red on brotli-libs (CVE-2026-111497) and curl (CVE-2026-92392). Back to 0,
  # but by `apk upgrade` in the runtime stage rather than a base bump: 1.31-alpine is
  # the newest minor nginx publishes and upstream had not rebuilt it against the
  # Alpine fixes, so there was nothing to bump to. See docker/frontend/Dockerfile.
  # api measured 0 unchanged. The two ungated counts were not re-measured and will
  # have moved -- they are reported, not gated, so nothing depends on them being
  # current.
  #
  # Spark's are Java jars *inside the pyspark wheel*; Airflow's are the upstream
  # official image and its providers. Trivy calls them fixable because a fix exists
  # in the upstream library -- not because this repository can apply it without
  # vendoring a patched Spark or leaving the official Airflow image. Gating on them
  # would make the job permanently red, and a permanently red job is one nobody
  # reads. Same reasoning as the alert rules in monitoring/prometheus/alerts.yml.
  #
  # `gate: true` is therefore a claim: these two images are held at zero.
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: api, gate: true}
          - {image: frontend, gate: true}
          - {image: spark, gate: false}
          - {image: airflow, gate: false}
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - name: Build ${{ matrix.image }}
        run: docker compose build ${{ matrix.image }}

      # SARIF first and always, so the Security tab shows everything including the
      # unfixable findings. The gate below is deliberately narrower than this.
      - name: Scan (report everything)
        continue-on-error: true
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" -w /work \
            "$TRIVY" image --quiet --scanners vuln \
            --format sarif --output "trivy-${{ matrix.image }}.sarif" \
            "confidentia-${{ matrix.image }}:latest"
      - name: Upload to the Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}
        continue-on-error: true

      # The gate, for the images this repository controls. `--ignore-unfixed` is
      # half the design: the Debian and Alpine bases carry dozens of CVEs with no
      # published fix -- perl-base, ncurses, linux-libc-dev -- and failing on those
      # means red forever, which is the same as having no job at all.
      - name: Fail on fixable HIGH/CRITICAL
        if: matrix.gate
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" -w /work \
            "$TRIVY" image --quiet --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile .trivyignore --exit-code 1 \
            "confidentia-${{ matrix.image }}:latest"

      # For the two that are not gated, make the number visible in the job summary
      # rather than only in the Security tab. A number nobody sees is a number
      # nobody argues about.
      - name: Report (not gated)
        if: ${{ !matrix.gate }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "$TRIVY" image --quiet --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed \
            "confidentia-${{ matrix.image }}:latest" | tee scan.txt || true
          {
            echo "### ${{ matrix.image }}: reported, not gated"
            echo
            echo "Findings are inside the pyspark wheel or the upstream Airflow image."
            echo "See ADR 0020, and the Security tab for the full SARIF."
            echo
            echo '```'
            grep -E '^Total:|^confidentia' scan.txt | head -20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Secrets that should never have been committed. Runs on the full history rather
  # than the diff: this repository had its history discarded once already, at
  # Stage 1, after AES-256 test keys were committed.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Scan the working tree for secrets
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            "$TRIVY" fs --quiet --scanners secret \
            --severity HIGH,CRITICAL --exit-code 1 .
