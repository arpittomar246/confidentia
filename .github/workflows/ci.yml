name: CI

on:
  push: {branches: [main, "stage/**"]}
  pull_request: {branches: [main]}
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"   # PySpark 3.5 does not support 3.12+ reliably
  JAVA_VERSION: "17"       # Spark 3.5 supports Java 8/11/17 only

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      # mypy must see the same dependencies the code imports, or it checks a
      # fiction: without pyspark installed, `F.pandas_udf` resolves to Any and a
      # necessary `type: ignore` is reported as unused. Every extra the source
      # imports at module scope is installed here, at the cost of a slower job.
      - run: pip install -e ".[dev,storage,generators,ingestion,spark,lake,api]"
      - name: ruff
        run: ruff check src tests spikes orchestration
      - name: mypy
        run: mypy

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      # pytest collects every test module before filtering by marker, so the unit
      # run still imports the integration tests and needs the storage driver.
      # pyspark is needed too: quality rules are Spark Column predicates, so even
      # constructing the rule catalogue imports pyspark.sql.functions. `api` joined
      # the list at Stage 10 for the same reason: tests/api/test_security.py is a
      # unit test and imports FastAPI at module scope.
      - run: pip install -e ".[dev,generators,storage,ingestion,spark,api]"
      - run: pytest -m unit --cov=confidentia --cov-report=term-missing

  # The integration tests assert the properties the ingestion design rests on:
  # the same content never loads twice, a failed run is recorded as failed rather
  # than left dangling, and a watermark can be rolled back. They passed locally
  # from Stage 3 onwards but were not a CI job, because the workflow provisioned
  # no database -- so nothing would have caught a change that broke them on a
  # machine other than this one.
  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: confidentia
          POSTGRES_PASSWORD: confidentia
          POSTGRES_DB: confidentia
        ports: ["5432:5432"]
        # Without the health check the job races the container and fails
        # intermittently, which is worse than not running at all: a flaky job
        # gets ignored, and then so do its real failures.
        options: >-
          --health-cmd "pg_isready -U confidentia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_USER: confidentia
      POSTGRES_PASSWORD: confidentia
      POSTGRES_DATABASE: confidentia
      # The OLTP database is created by migration 003; point it at the same
      # server. Only the platform migrations matter for these tests.
      POSTGRES_OLTP_DATABASE: ehr_oltp
      CONFIDENTIA_DATA_ROOT: /tmp/confidentia-data
      CONFIDENTIA_KEYSTORE_PASSPHRASE: ci-only-throwaway-passphrase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev,generators,storage,ingestion,spark,api]"
      - name: create the OLTP database
        run: PGPASSWORD=confidentia psql -h localhost -U confidentia -d confidentia -c "CREATE DATABASE ehr_oltp"
      - name: apply migrations
        run: python -m confidentia.cli db migrate
      - run: pytest -m integration

  # The ground-truth answer key records every injected defect and every latent
  # fraud label. A pipeline that read it would score perfectly and mean nothing,
  # so isolation is enforced rather than trusted.
  ground-truth-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check_ground_truth_isolation.sh

  # A defect the generator injects into a column no rule covers is a permanent
  # false negative: it can never be detected, so it depresses recall for a reason
  # that has nothing to do with the quality layer. Stage 7b spent most of its
  # findings on exactly this, and Stage 7c closed the last of them -- this job is
  # what stops the next one appearing silently.
  plan-rule-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e ".[dev,generators,storage,ingestion,spark,lake,api,observability]"
      - run: python scripts/check_plan_rule_coverage.py

  # The DAGs shell out to `confidentia ...` rather than importing the package
  # (ADR 0013), so a renamed CLI command leaves a DAG referring to one that no
  # longer exists and nothing notices until a task fails at 03:00. This resolves
  # every command a DAG invokes against the real Typer tree. No Airflow needed.
  dag-cli-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e ".[dev,generators,storage,ingestion,spark,lake,api,observability]"
      - run: python scripts/check_dag_cli_contract.py

  # The OpenAPI schema is committed so Stage 11 can generate a typed client without
  # standing up the API. A route or response shape changed without a re-export is
  # exactly the drift a committed artefact is supposed to make visible, so the check
  # regenerates it and compares.
  openapi-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e ".[dev,generators,storage,ingestion,spark,api]"
      - run: python scripts/export_openapi.py --check

  # Two dependencies were once installed by hand and never declared, so the project
  # worked locally and was uninstallable everywhere else. Needs no install step: it
  # reads the AST and pyproject.toml only.
  declared-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python scripts/check_declared_dependencies.py

  # The encryption guarantee is a regression risk, not a one-off result. Delta
  # silently wrote plaintext when the properties were passed as writer options
  # (ADR 0007), so CI re-proves on every push that sensitive columns are absent
  # from the bytes on disk and that a keyless read is refused.
  encryption-guarantee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[spark,lake,dev]"
      - name: Build the KMS client jar
        run: python spikes/pme/build_kms_jar.py
      - name: Write encrypted tables and verify the bytes
        env:
          SPIKE_WORK_DIR: ${{ runner.temp }}/spike
        run: |
          python spikes/pme/probes.py write-parquet
          python spikes/pme/probes.py delta-hadoopconf
      - name: Verify a keyless read is refused
        env:
          SPIKE_WORK_DIR: ${{ runner.temp }}/spike
        # Separate process on purpose: Parquet's KeyToolkit caches unwrapped keys
        # per JVM, so an in-process retry would read from cache and falsely pass.
        run: |
          python spikes/pme/probes.py keyless-read --table h_parquet_pme --format parquet
          python spikes/pme/probes.py keyless-read --table g_delta_hadoopconf --format delta
      - name: Inspect files for plaintext leakage
        env:
          SPIKE_WORK_DIR: ${{ runner.temp }}/spike
        run: python spikes/pme/inspect_files.py "${{ runner.temp }}/spike"

  # Determinism is load-bearing: experiment E3 compares incremental against full
  # reprocessing of the same data, and E8 replays a dataset under a drifted
  # schema. Neither is valid if the generators wander between runs.
  generator-determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      # pytest collects every test module before filtering by marker, so the unit
      # run still imports the integration tests and needs the storage driver.
      # pyspark is needed too: quality rules are Spark Column predicates, so even
      # constructing the rule catalogue imports pyspark.sql.functions.
      - run: pip install -e ".[dev,generators,storage,ingestion,spark]"
      - name: Generate twice and compare digests
        run: |
          python -m confidentia.cli generate healthcare --rows 20000 --out /tmp/gen-a
          python -m confidentia.cli generate healthcare --rows 20000 --out /tmp/gen-b
          python - <<'PY'
          import json, sys, pathlib
          bad = []
          for a in pathlib.Path("/tmp/gen-a").rglob("_ingest_manifest.json"):
              b = pathlib.Path(str(a).replace("/tmp/gen-a", "/tmp/gen-b"))
              da = json.loads(a.read_text())["batch_digest"]
              db = json.loads(b.read_text())["batch_digest"]
              status = "ok" if da == db else "MISMATCH"
              print(f"{a.parent.name:18s} {status} {da[:16]}")
              if da != db:
                  bad.append(a.parent.name)
          sys.exit(1 if bad else 0)
          PY

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose profiles
        run: |
          for profile in core batch stream bench demo; do
            echo "--- $profile ---"
            docker compose --profile "$profile" config --quiet
          done
