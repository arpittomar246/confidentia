name: CI

on:
  push: {branches: [main, "stage/**"]}
  pull_request: {branches: [main]}
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"   # PySpark 3.5 does not support 3.12+ reliably
  JAVA_VERSION: "17"       # Spark 3.5 supports Java 8/11/17 only

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      # mypy must see the same dependencies the code imports, or it checks a
      # fiction: without pyspark installed, `F.pandas_udf` resolves to Any and a
      # necessary `type: ignore` is reported as unused. Every extra the source
      # imports at module scope is installed here, at the cost of a slower job.
      - run: pip install -e ".[dev,storage,generators,ingestion,spark,lake,api]"
      - name: ruff
        run: ruff check src tests spikes
      - name: mypy
        run: mypy

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      # pytest collects every test module before filtering by marker, so the unit
      # run still imports the integration tests and needs the storage driver.
      # pyspark is needed too: quality rules are Spark Column predicates, so even
      # constructing the rule catalogue imports pyspark.sql.functions.
      - run: pip install -e ".[dev,generators,storage,ingestion,spark]"
      - run: pytest -m unit --cov=confidentia --cov-report=term-missing

  # The ground-truth answer key records every injected defect and every latent
  # fraud label. A pipeline that read it would score perfectly and mean nothing,
  # so isolation is enforced rather than trusted.
  ground-truth-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check_ground_truth_isolation.sh

  # Two dependencies were once installed by hand and never declared, so the project
  # worked locally and was uninstallable everywhere else. Needs no install step: it
  # reads the AST and pyproject.toml only.
  declared-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python scripts/check_declared_dependencies.py

  # The encryption guarantee is a regression risk, not a one-off result. Delta
  # silently wrote plaintext when the properties were passed as writer options
  # (ADR 0007), so CI re-proves on every push that sensitive columns are absent
  # from the bytes on disk and that a keyless read is refused.
  encryption-guarantee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[spark,lake,dev]"
      - name: Build the KMS client jar
        run: python spikes/pme/build_kms_jar.py
      - name: Write encrypted tables and verify the bytes
        env:
          SPIKE_WORK_DIR: ${{ runner.temp }}/spike
        run: |
          python spikes/pme/probes.py write-parquet
          python spikes/pme/probes.py delta-hadoopconf
      - name: Verify a keyless read is refused
        env:
          SPIKE_WORK_DIR: ${{ runner.temp }}/spike
        # Separate process on purpose: Parquet's KeyToolkit caches unwrapped keys
        # per JVM, so an in-process retry would read from cache and falsely pass.
        run: |
          python spikes/pme/probes.py keyless-read --table h_parquet_pme --format parquet
          python spikes/pme/probes.py keyless-read --table g_delta_hadoopconf --format delta
      - name: Inspect files for plaintext leakage
        env:
          SPIKE_WORK_DIR: ${{ runner.temp }}/spike
        run: python spikes/pme/inspect_files.py "${{ runner.temp }}/spike"

  # Determinism is load-bearing: experiment E3 compares incremental against full
  # reprocessing of the same data, and E8 replays a dataset under a drifted
  # schema. Neither is valid if the generators wander between runs.
  generator-determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      # pytest collects every test module before filtering by marker, so the unit
      # run still imports the integration tests and needs the storage driver.
      # pyspark is needed too: quality rules are Spark Column predicates, so even
      # constructing the rule catalogue imports pyspark.sql.functions.
      - run: pip install -e ".[dev,generators,storage,ingestion,spark]"
      - name: Generate twice and compare digests
        run: |
          python -m confidentia.cli generate healthcare --rows 20000 --out /tmp/gen-a
          python -m confidentia.cli generate healthcare --rows 20000 --out /tmp/gen-b
          python - <<'PY'
          import json, sys, pathlib
          bad = []
          for a in pathlib.Path("/tmp/gen-a").rglob("_ingest_manifest.json"):
              b = pathlib.Path(str(a).replace("/tmp/gen-a", "/tmp/gen-b"))
              da = json.loads(a.read_text())["batch_digest"]
              db = json.loads(b.read_text())["batch_digest"]
              status = "ok" if da == db else "MISMATCH"
              print(f"{a.parent.name:18s} {status} {da[:16]}")
              if da != db:
                  bad.append(a.parent.name)
          sys.exit(1 if bad else 0)
          PY

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose profiles
        run: |
          for profile in core batch stream bench demo; do
            echo "--- $profile ---"
            docker compose --profile "$profile" config --quiet
          done
