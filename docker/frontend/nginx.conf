# Serving a single-page application.
#
# `try_files ... /index.html` is the load-bearing line. React Router owns paths like
# /evaluation and /lineage, but the browser asks the *server* for them on a reload
# or a pasted link — and a static server without this returns 404. That is not
# hypothetical: verifying this stage against `python -m http.server` produced
# exactly that, on the first attempt to open /evaluation directly.
server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames change on every build, so they can be cached hard.
    # index.html must not be: it is the file that names the current hashes, and a
    # cached copy points at assets the new build deleted — a blank page and a 404
    # in the console, which is what a stale index.html looked like during Stage 11.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # The console calls /api/*, so in a container it never leaves this origin and
    # CORS is not involved at all. `VITE_API_BASE_URL` is deliberately unset in the
    # compose service: Vite inlines it at image-build time, so configuring the API
    # location by environment variable would silently do nothing.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The Authorization header is forwarded by default; naming it here so that
        # a future edit adding proxy_set_header does not accidentally drop it.
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The console fetches the API cross-origin using a bearer token, so no cookie
    # is ever set and these are cheap. CSP is deliberately strict about connect-src
    # being same-origin plus the API: this page has no reason to talk anywhere else,
    # and a dashboard that can reach arbitrary hosts is a data-exfiltration path.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
