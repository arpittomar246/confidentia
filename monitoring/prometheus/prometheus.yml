# Prometheus configuration for the CONFIDENTIA stack.
#
# One scrape target that matters: the API, which exposes both its own HTTP metrics
# and the platform gauges read from PostgreSQL. There is deliberately no
# postgres_exporter and no node_exporter -- connection counts and disk usage are
# not what anyone would be paged about here, and adding exporters whose output
# nobody reads is how a monitoring stack becomes decoration.

global:
  # 30s rather than the usual 15s. The platform gauges are cached for 30s in the
  # API (they read eight aggregate queries), so scraping faster would return the
  # same numbers twice and halve the cache's usefulness.
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    stack: confidentia

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: confidentia-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api
    # `/metrics` is authenticated unless API_METRICS_PUBLIC is set, which the
    # compose stack does. In a deployment where it is not public, this is where the
    # bearer token goes:
    #
    #   authorization:
    #     type: Bearer
    #     credentials_file: /etc/prometheus/api-token
    #
    # Left commented rather than removed: the endpoint defaults to requiring a
    # viewer role, and the next person to deploy this needs to know where the
    # token belongs.

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
